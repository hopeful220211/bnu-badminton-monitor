name: badminton-monitor

# 每班在 job 里连续轮询最多 5.5 小时，结束时自己触发下一班（workflow_dispatch），全天接力不断档。
# GitHub 的 cron 不准时、还常漏触发，只当备用：万一接力断了，定时任务会把它重新拉起来。
# concurrency 保证同一时间只有一班在跑、最多一班在排队。
# 注意：只有放在仓库根目录、并且在默认分支上的工作流才会按 schedule 定时运行。
on:
  schedule:
    - cron: "17 */2 * * *"
    - cron: "40 22 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "本班最长运行秒数（loop 用，默认 19800 = 5.5 小时）"
        type: string
        default: "19800"
      mode:
        description: "手动运行：loop=正常监控 / fresh-loop=清空已提醒记录后监控（当前空位重发一遍）/ test-email=发测试邮件 / sample-alerts=按真实格式发普通、连续场提醒各一封 / check=查一轮看日志"
        type: choice
        options: [loop, fresh-loop, test-email, sample-alerts, check]
        default: loop

# 定时/loop 共用一个队列前后接力；手动的 test-email、check 单独排队，不用等长跑结束
concurrency:
  group: badminton-monitor-${{ (inputs.mode == 'test-email' || inputs.mode == 'sample-alerts' || inputs.mode == 'check') && inputs.mode || 'loop' }}
  cancel-in-progress: false

# contents: write 用于 keepalive 空提交（仓库 60 天没有提交，GitHub 会自动停用定时任务）
# actions: write 用于一班结束时触发下一班
permissions:
  contents: write
  actions: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Keepalive
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "距上次提交 ${days} 天"
          if [ "$days" -ge 40 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive [skip ci]"
            git push
          fi

      # 跨班次保留「已提醒过的空位」，避免重复发邮件
      # 只有监控班次读写去重状态；手动的测试/检查不碰它，免得旧状态盖掉新的
      - name: Restore state
        if: inputs.mode == '' || inputs.mode == 'loop'
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: badminton-state-${{ github.run_id }}
          restore-keys: badminton-state-

      - name: Run monitor
        env:
          BNU_REQUEST_CURL: ${{ secrets.BNU_REQUEST_CURL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          echo "SHIFT_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          if [ -z "$BNU_REQUEST_CURL" ] && [ "${{ inputs.mode }}" != "test-email" ] && [ "${{ inputs.mode }}" != "sample-alerts" ]; then
            echo "还没配置 Secret BNU_REQUEST_CURL，跳过本次监控"
            exit 0
          fi
          case "${{ inputs.mode }}" in
            test-email) python monitor.py --test-email ;;
            sample-alerts) python monitor.py --sample-alerts ;;
            check)      python monitor.py --check ;;
            *)          python monitor.py --ci-loop "${{ inputs.duration || '19800' }}" ;;   # loop / fresh-loop / 定时触发
          esac

      - name: Save state
        if: always() && (inputs.mode == '' || inputs.mode == 'loop' || inputs.mode == 'fresh-loop')
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: badminton-state-${{ github.run_id }}

      # 接力：本班正常结束就触发下一班。手动取消（想停掉监控）时不接力。
      - name: Start next shift
        if: "!cancelled() && (inputs.mode == '' || inputs.mode == 'loop' || inputs.mode == 'fresh-loop')"
        env:
          GH_TOKEN: ${{ github.token }}
          DURATION: ${{ inputs.duration || '19800' }}
        run: |
          # 本班没跑够时长就退出（配置错误、崩溃），说明有问题，不接力，免得无限快速重启；交给定时任务兜底
          elapsed=$(( $(date +%s) - ${SHIFT_STARTED:-0} ))
          if [ "$elapsed" -lt 600 ] && [ "$elapsed" -lt $(( DURATION * 9 / 10 )) ]; then
            echo "本班只跑了 ${elapsed} 秒就结束，不接力"
            exit 0
          fi
          gh workflow run badminton-monitor.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" -f mode=loop
          echo "已触发下一班"
